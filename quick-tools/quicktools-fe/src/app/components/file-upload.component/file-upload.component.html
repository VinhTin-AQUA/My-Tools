<div
    class="file-upload-container"
    [class.dragging]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
>
    <p class="file-upload-empty-text">Drag and drop files to here to upload.</p>

    <div class="file-upload-actions">
        <p-fileupload
            #fileUpload
            mode="basic"
            chooseIcon="pi pi-upload"
            chooseLabel="Browse"
            chooseStyleClass="file-upload-choose"
            accept="image/*"
            (onSelect)="onSelectFile($event)"
            multiple="true"
        />
