<p-dialog
    appendTo="body"
    header="Password details"
    [visible]="visible()"
    (visibleChange)="visibleChange.emit($event)"
    [modal]="true"
    [dismissableMask]="true"
    [closable]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: 'min(32rem, calc(100vw - 2rem))' }"
    [contentStyle]="{ maxHeight: 'calc(100vh - 9rem)', overflowY: 'auto' }"
>
    @if (fields().length) {
        <div class="flex flex-col gap-3">
            @for (field of fields(); track field.label) {
                <div
                    class="flex items-start gap-3 rounded-lg border border-[color:var(--p-content-border-color)] p-3"
                >
                    <div class="min-w-0 flex-1">
                        <p
                            class="m-0 text-xs font-medium text-[color:var(--p-text-muted-color)]"
                        >
                            {{ field.label }}
                        </p>

                        <p
                            class="m-0 mt-1 text-sm break-all whitespace-pre-wrap text-[color:var(--p-text-color)]"
                        >
                            {{ field.value || '—' }}
                        </p>
                    </div>

                    <p-button
                        icon="pi pi-copy"
                        class="shrink-0"
                        severity="secondary"
                        [text]="true"
                        [rounded]="true"
                        [ariaLabel]="'Copy ' + field.label"
                        (onClick)="copyValue(field)"
                    />
                </div>
            }

            <div class="flex justify-end pt-1">
                <p-button
                    type="button"
                    label="Close"
                    severity="secondary"
                    [outlined]="true"
                    [fluid]="true"
                    styleClass="w-full sm:w-auto"
                    (onClick)="close()"
                />
            </div>
        </div>
    } @else {
        <p class="m-0 text-sm text-[color:var(--p-text-muted-color)]">No password selected.</p>
    }
</p-dialog>
