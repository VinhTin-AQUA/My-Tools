<div class="fixed inset-0 z-50">
    <!-- Overlay -->
    <div class="absolute inset-0 flex items-center justify-center p-4 sm:p-6">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-[rgba(30,30,46,0.65)] backdrop-blur-[3px]"></div>

        <!-- Popup -->
        <div
            class="relative z-10 w-full max-w-136 overflow-hidden rounded-3xl border border-(--p-surface-300) bg-(--p-content-background) shadow-2xl"
            role="alertdialog"
            aria-modal="true"
        >
            <!-- Navigation -->
            <header class="border-b border-(--p-border-color) bg-(--p-surface-50) px-4 py-3">
                <app-navigation-component></app-navigation-component>
            </header>

            <!-- Content -->
            <div
                class="flex flex-col items-center px-6 py-8 text-center sm:px-10 sm:py-10 lg:px-12 lg:py-12"
            >
                <!-- Icon -->
                <div
                    class="flex size-20 shrink-0 items-center justify-center rounded-full sm:size-24"
                    [ngClass]="
                        success()
                            ? 'bg-(--p-green-100) text-(--p-green-600)'
                            : 'bg-(--p-red-100) text-(--p-red-600)'
                    "
                >
                    @if (success()) {
                        <i class="pi pi-check text-3xl sm:text-4xl" aria-hidden="true"></i>
                    } @else {
                        <i
                            class="pi pi-exclamation-triangle text-3xl sm:text-4xl"
                            aria-hidden="true"
                        ></i>
                    }
                </div>

                <!-- Title -->
                <h2
                    class="mt-6 text-xl font-semibold leading-7 text-(--p-text-color) sm:mt-7 sm:text-2xl"
                >
                    {{ title() }}
                </h2>

                <!-- Message -->
                <p
                    class="mt-3 max-w-lg text-sm leading-6 text-(--p-text-muted-color) sm:mt-4 sm:text-base sm:leading-7"
                >
                    {{ message() }}
                </p>
            </div>
        </div>
    </div>
</div>
