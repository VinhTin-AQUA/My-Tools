<div
    class="password-popup-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
    (click)="close()"
>
    <div
        class="password-popup-panel flex max-h-[calc(100vh-2rem)] w-full max-w-[32rem] flex-col overflow-hidden rounded-xl border border-[color:var(--p-content-border-color)] bg-[color:var(--p-content-background)] shadow-2xl"
        role="dialog"
        aria-modal="true"
        aria-labelledby="view-password-title"
        (click)="$event.stopPropagation()"
    >
        <div
            class="flex items-center justify-between gap-3 border-b border-[color:var(--p-content-border-color)] px-4 py-3"
        >
            <h2
                id="view-password-title"
                class="m-0 text-base font-semibold text-[color:var(--p-text-color)]"
            >
                Password details
            </h2>

            <p-button
                type="button"
                icon="pi pi-times"
                severity="secondary"
                [text]="true"
                [rounded]="true"
                ariaLabel="Close"
                (onClick)="close()"
            />
        </div>

        <div class="max-h-[calc(100vh-9rem)] overflow-y-auto p-4">
    @if (fields().length) {
        <div class="flex flex-col gap-3">
            @for (field of fields(); track field.label) {
                <div
                    class="flex items-start gap-3 rounded-lg border border-[color:var(--p-content-border-color)] p-3"
                >
                    <div class="min-w-0 flex-1">
                        <p
                            class="m-0 text-xs font-medium text-[color:var(--p-text-muted-color)]"
                        >
                            {{ field.label }}
                        </p>

                        <p
                            class="m-0 mt-1 text-sm break-all whitespace-pre-wrap text-[color:var(--p-text-color)]"
                        >
                            {{ displayValue(field) }}
                        </p>
                    </div>

                    @if (field.label === 'Password') {
                        <p-button
                            class="shrink-0"
                            [icon]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"
                            severity="secondary"
                            [text]="true"
                            [rounded]="true"
                            [ariaLabel]="showPassword() ? 'Hide password' : 'Show password'"
                            [attr.aria-pressed]="showPassword()"
                            (onClick)="togglePasswordVisibility()"
                        />
                    }

                    <p-button
                        icon="pi pi-copy"
                        class="shrink-0"
                        severity="secondary"
                        [text]="true"
                        [rounded]="true"
                        [ariaLabel]="'Copy ' + field.label"
                        (onClick)="copyValue(field)"
                    />
                </div>
            }

            <div class="flex justify-end pt-1">
                <p-button
                    type="button"
                    label="Close"
                    severity="secondary"
                    [outlined]="true"
                    [fluid]="true"
                    styleClass="w-full sm:w-auto"
                    (onClick)="close()"
                />
            </div>
        </div>
    } @else {
        <p class="m-0 text-sm text-[color:var(--p-text-muted-color)]">No password selected.</p>
    }
        </div>
    </div>
</div>
