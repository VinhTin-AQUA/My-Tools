<p-dialog
    appendTo="body"
    header="Set URL"
    [visible]="visible()"
    (visibleChange)="visibleChange.emit($event)"
    [modal]="true"
    [dismissableMask]="true"
    [closable]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: 'min(28rem, calc(100vw - 2rem))' }"
    [contentStyle]="{ maxHeight: 'calc(100vh - 9rem)', overflowY: 'auto' }"
>
    <form class="flex flex-col gap-4" novalidate (submit)="onSubmit($event)">
        <div class="flex flex-col gap-1.5">
            <label for="set-url-value" class="text-sm font-medium text-[color:var(--p-text-color)]">
                URL
            </label>

            <input
                pInputText
                id="set-url-value"
                type="text"
                inputmode="url"
                autocomplete="url"
                placeholder="https://example.com"
                class="w-full"
                [formField]="urlForm.url"
            />

            @if (urlForm.url().touched() && urlForm.url().errors().length) {
                <small class="text-xs text-[color:var(--p-danger-color)]">
                    {{ urlForm.url().errors()[0].message }}
                </small>
            }
        </div>

        <div class="flex flex-col-reverse gap-2 pt-1 sm:flex-row sm:justify-end">
            <p-button
                type="button"
                label="Cancel"
                severity="secondary"
                [outlined]="true"
                [fluid]="true"
                styleClass="w-full sm:w-auto"
                (onClick)="close()"
            />

            <p-button
                type="submit"
                label="Save"
                icon="pi pi-check"
                [fluid]="true"
                styleClass="w-full sm:w-auto"
            />
        </div>
    </form>
</p-dialog>
