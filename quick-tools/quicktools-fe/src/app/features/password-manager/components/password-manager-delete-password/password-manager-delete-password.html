<div
    class="password-popup-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
    (click)="close()"
>
    <div
        class="password-popup-panel flex max-h-[calc(100vh-2rem)] w-full max-w-[28rem] flex-col overflow-hidden rounded-xl border border-[color:var(--p-content-border-color)] bg-[color:var(--p-content-background)] shadow-2xl"
        role="dialog"
        aria-modal="true"
        aria-labelledby="delete-password-title"
        (click)="$event.stopPropagation()"
    >
        <div
            class="flex items-center justify-between gap-3 border-b border-[color:var(--p-content-border-color)] px-4 py-3"
        >
            <h2
                id="delete-password-title"
                class="m-0 text-base font-semibold text-[color:var(--p-text-color)]"
            >
                Delete password
            </h2>

            <p-button
                type="button"
                icon="pi pi-times"
                severity="secondary"
                [text]="true"
                [rounded]="true"
                [disabled]="isDeleting()"
                ariaLabel="Close"
                (onClick)="close()"
            />
        </div>

        <div class="max-h-[calc(100vh-9rem)] overflow-y-auto p-4">
    <div class="flex flex-col gap-5">
        <div class="flex items-start gap-3">
            <span
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[color:var(--p-highlight-background)] text-[color:var(--p-danger-color)]"
                aria-hidden="true"
            >
                <i class="pi pi-exclamation-triangle"></i>
            </span>

            <div class="min-w-0">
                <p class="m-0 text-sm text-[color:var(--p-text-color)]">
                    Are you sure you want to delete this password?
                </p>

                <p class="m-0 mt-1 text-xs text-[color:var(--p-text-muted-color)]">
                    This action cannot be undone.
                </p>
            </div>
        </div>

        <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <p-button
                type="button"
                label="Cancel"
                severity="secondary"
                [outlined]="true"
                [fluid]="true"
                [disabled]="isDeleting()"
                styleClass="w-full sm:w-auto"
                (onClick)="close()"
            />

            <p-button
                type="button"
                label="Delete"
                icon="pi pi-trash"
                severity="danger"
                [loading]="isDeleting()"
                [fluid]="true"
                styleClass="w-full sm:w-auto"
                [disabled]="passwordId() === null"
                (onClick)="confirmDelete()"
            />
        </div>
        </div>
    </div>
</div>
