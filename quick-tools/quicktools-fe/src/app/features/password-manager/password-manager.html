<div class="passwords-page min-h-screen">
    <p-toast />

    <div
        class="mx-auto flex w-full max-w-2xl flex-col gap-4 p-4 pb-24 sm:gap-6 sm:p-6 sm:pb-28 lg:p-8 lg:pb-32"
    >
        <!-- =====================================================
             HEADER
        ====================================================== -->
        <header class="grid grid-cols-[1fr_auto_1fr] items-center gap-2">
            <!-- Back -->
            <div class="justify-self-start">
                <app-navigation-component />
            </div>

            <!-- Title -->
            <h1
                class="passwords-text m-0 truncate text-center text-lg font-semibold tracking-tight sm:text-xl"
            >
                Passwords
            </h1>

            <!-- Actions -->
            <div class="flex items-center justify-self-end gap-1">
                <p-button
                    icon="pi pi-refresh"
                    severity="secondary"
                    [text]="true"
                    [rounded]="true"
                    ariaLabel="Reload passwords"
                    (onClick)="onReload()"
                />

                <p-button
                    icon="pi pi-bars"
                    severity="secondary"
                    [text]="true"
                    [rounded]="true"
                    ariaLabel="Open menu"
                    (onClick)="openHeaderMenu($event)"
                />
            </div>
        </header>

        <!-- =====================================================
             PASSWORD LIST
        ====================================================== -->
        <section
            class="passwords-surface overflow-hidden rounded-xl border"
            aria-label="Saved passwords"
        >
            @if (isLoading()) {
                <div class="flex items-center justify-center px-4 py-16">
                    <app-loader />
                </div>
            } @else {
                @for (item of passwords(); track item.id) {
                <article
                    class="passwords-card flex items-center gap-3 border-b px-3 py-3 last:border-b-0 sm:gap-4 sm:px-4"
                >
                    <!-- Account icon -->
                    <div
                        class="passwords-icon flex h-10 w-10 shrink-0 items-center justify-center rounded-lg"
                        aria-hidden="true"
                    >
                        <i class="pi pi-key text-base"></i>
                    </div>

                    <!-- Account name -->
                    <div class="min-w-0 flex-1">
                        <p
                            class="passwords-text m-0 truncate text-sm font-medium sm:text-base"
                            [pTooltip]="item.accountName"
                            tooltipPosition="top"
                        >
                            {{ item.accountName }}
                        </p>
                    </div>

                    <!-- Context menu -->
                    <p-button
                        icon="pi pi-ellipsis-v"
                        severity="secondary"
                        [text]="true"
                        [rounded]="true"
                        size="small"
                        class="shrink-0"
                        [ariaLabel]="'More actions for ' + item.accountName"
                        (onClick)="openItemMenu($event, item)"
                    />
                </article>
            } @empty {
                <div class="flex flex-col items-center justify-center gap-2 px-4 py-16 text-center">
                    <div
                        class="passwords-empty-icon flex h-14 w-14 items-center justify-center rounded-full"
                        aria-hidden="true"
                    >
                        <i class="pi pi-key text-xl"></i>
                    </div>

                    <p class="passwords-text m-0 text-sm font-medium">No passwords yet</p>

                    <p class="passwords-text-muted m-0 text-xs">
                        Your saved accounts will appear here.
                    </p>
                </div>
            }
            }
        </section>
    </div>

    <!-- =====================================================
         DROPDOWN MENUS
    ====================================================== -->
    <p-menu #headerMenu [popup]="true" [model]="headerMenuItems" appendTo="body" />
    <p-menu #itemMenu [popup]="true" [model]="itemMenuItems" appendTo="body" />

    <!-- =====================================================
         FIXED ADD BUTTON
    ====================================================== -->
    <div class="fixed right-4 bottom-4 z-20 sm:right-6 sm:bottom-6">
        <p-button
            icon="pi pi-plus"
            severity="primary"
            ariaLabel="Add password"
            styleClass="!w-14 !h-14 !rounded-full shadow-lg"
            (onClick)="openAddPassword()"
        />
    </div>

    <!-- =====================================================
         POPUPS
    ====================================================== -->
    <app-password-manager-set-key
        [visible]="showSetKey()"
        [existingKey]="key()"
        (visibleChange)="showSetKey.set($event)"
        (keySaved)="onKeySaved($event)"
    />

    <app-password-manager-set-url
        [visible]="showSetUrl()"
        [currentUrl]="url()"
        (visibleChange)="showSetUrl.set($event)"
        (urlSaved)="onUrlSaved($event)"
    />

    <app-password-manager-view-password
        [visible]="showViewPassword()"
        [password]="selectedPassword()"
        (visibleChange)="showViewPassword.set($event)"
    />

    <app-password-manager-edit-password
        [visible]="showEditPassword()"
        [password]="selectedPassword()"
        (visibleChange)="showEditPassword.set($event)"
        (passwordUpdated)="onPasswordUpdated($event)"
    />

    <app-password-manager-delete-password
        [visible]="showDeletePassword()"
        [passwordId]="selectedPassword()?.id ?? null"
        (visibleChange)="showDeletePassword.set($event)"
        (passwordDeleted)="onPasswordDeleted($event)"
    />

    <app-password-manager-add-password
        [visible]="showAddPassword()"
        (visibleChange)="showAddPassword.set($event)"
        (passwordAdded)="onPasswordAdded($event)"
    />
</div>
