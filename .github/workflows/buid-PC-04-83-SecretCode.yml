name: PC 04 83 SecretCode


on:
    push:
        branches: ['main']
        paths:
            - 'PC-04-83-SecretCode/**'
            - '.github/workflows/buid-PC-04-83-SecretCode.yml'

    pull_request:
        branches: ['main']
        paths:
            - 'PC-04-83-SecretCode/**'
            - '.github/workflows/buid-PC-04-83-SecretCode.yml'
defaults:
    run:
        working-directory: PC-04-83-SecretCode # only apply for run command

env:
  PROJECT_DIR: PC-04-83-SecretCode
  RELEASE_NAME: PC-04-83-SecretCode_v1.0.0 

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore

            - name: Publish Release - Self-contained
              if: success() # chỉ chạy khi các bước trước thành công
              run: dotnet publish PC0483SecretCode/PC0483SecretCode.csproj -c Release -r win-x64 -p:SelfContained=true  -o ./publish/win64

            - name: Upload published app
              uses: actions/upload-artifact@v4
              with:
                  name: published-app # Tên của artifact sau khi tải lên
                  path: ${{ env.PROJECT_DIR }}/publish/win64 # Đường dẫn tệp/thư mục cần upload
                  retention-days: 1 # Hoặc 1-90 ngày tùy ý

    package:
        runs-on: windows-latest
        needs: build

        steps:
            - uses: actions/checkout@v4

            # Download artifact vào đúng thư mục project
            - name: Download published app
              uses: actions/download-artifact@v4
              with:
                  name: published-app
                  path: ${{ env.PROJECT_DIR }}/publish/win64

            # Cài Inno Setup
            - name: Install Inno Setup
              run: choco install innosetup --no-progress -y

            # Compile file ISS
            - name: Compile Inno Setup script
              run: |
                  iscc setup/setup.iss

            # Upload file exe đã build
            - name: Upload EXE artifact
              uses: actions/upload-artifact@v4
              with:
                  name: PC0483.exe
                  path: ${{ env.PROJECT_DIR }}/setup/PC0483.exe
    #
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        needs: package

        steps:
            - uses: actions/checkout@v4
            
            - name: Download exe file
              uses: actions/download-artifact@v4
              with:
                  name: PC0483.exe
                  path: .

            - name: Remove old tag if exists
              run: |
                if git ls-remote --tags origin | grep -q "refs/tags/${RELEASE_NAME}"; then
                  echo "Deleting old tag..."
                  git push origin :refs/tags/"${RELEASE_NAME}"
                else
                  echo "No old tag found."
                fi

            - name: Remove old release if exists
              run: |
                if gh release view "${RELEASE_NAME}" &>/dev/null; then
                  echo "Deleting old release..."
                  gh release delete "${RELEASE_NAME}" -y
                else
                  echo "No old release found."
                fi
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create GitHub Release
              id: create_release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ env.RELEASE_NAME }}
                  release_name: ${{ env.RELEASE_NAME }}
                  draft: false
                  prerelease: false

            - name: Upload exe to Release
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.create_release.outputs.upload_url }}
                  asset_path: ./PC0483.exe
                  asset_name: PC0483.exe
                  asset_content_type: application/vnd.microsoft.portable-executable
