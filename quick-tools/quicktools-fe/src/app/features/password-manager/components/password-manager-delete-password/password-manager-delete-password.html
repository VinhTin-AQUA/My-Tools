<p-dialog
    #dialog
    [appBlockOutsideClose]="isDeleting()"
    [appBlockOutsideCloseVisible]="visible()"
    (appBlockOutsideCloseDismiss)="close()"
    appendTo="body"
    header="Delete password"
    [visible]="visible()"
    (visibleChange)="onVisibleChange($event)"
    [modal]="true"
    [closable]="!isDeleting()"
    [closeOnEscape]="!isDeleting()"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: 'min(28rem, calc(100vw - 2rem))' }"
    [contentStyle]="{ maxHeight: 'calc(100vh - 9rem)', overflowY: 'auto' }"
>
    <div class="flex flex-col gap-5">
        <div class="flex items-start gap-3">
            <span
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[color:var(--p-highlight-background)] text-[color:var(--p-danger-color)]"
                aria-hidden="true"
            >
                <i class="pi pi-exclamation-triangle"></i>
            </span>

            <div class="min-w-0">
                <p class="m-0 text-sm text-[color:var(--p-text-color)]">
                    Are you sure you want to delete this password?
                </p>

                <p class="m-0 mt-1 text-xs text-[color:var(--p-text-muted-color)]">
                    This action cannot be undone.
                </p>
            </div>
        </div>

        <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <p-button
                type="button"
                label="Cancel"
                severity="secondary"
                [outlined]="true"
                [fluid]="true"
                [disabled]="isDeleting()"
                styleClass="w-full sm:w-auto"
                (onClick)="close()"
            />

            <p-button
                type="button"
                label="Delete"
                icon="pi pi-trash"
                severity="danger"
                [loading]="isDeleting()"
                [fluid]="true"
                styleClass="w-full sm:w-auto"
                [disabled]="passwordId() === null"
                (onClick)="confirmDelete()"
            />
        </div>
    </div>
</p-dialog>
