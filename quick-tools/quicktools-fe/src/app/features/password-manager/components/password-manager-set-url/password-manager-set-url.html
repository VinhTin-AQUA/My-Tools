<div
    class="password-popup-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
    (click)="close()"
>
    <div
        class="password-popup-panel flex max-h-[calc(100vh-2rem)] w-full max-w-[28rem] flex-col overflow-hidden rounded-xl border border-[color:var(--p-content-border-color)] bg-[color:var(--p-content-background)] shadow-2xl"
        role="dialog"
        aria-modal="true"
        aria-labelledby="set-url-title"
        (click)="$event.stopPropagation()"
    >
        <div
            class="flex items-center justify-between gap-3 border-b border-[color:var(--p-content-border-color)] px-4 py-3"
        >
            <h2
                id="set-url-title"
                class="m-0 text-base font-semibold text-[color:var(--p-text-color)]"
            >
                Set URL
            </h2>

            <p-button
                type="button"
                icon="pi pi-times"
                severity="secondary"
                [text]="true"
                [rounded]="true"
                [disabled]="isSaving()"
                ariaLabel="Close"
                (onClick)="close()"
            />
        </div>

        <div class="max-h-[calc(100vh-9rem)] overflow-y-auto p-4">
    <form class="flex flex-col gap-4" novalidate (submit)="onSubmit($event)">
        <div class="flex flex-col gap-1.5">
            <label for="set-url-value" class="text-sm font-medium text-[color:var(--p-text-color)]">
                URL
            </label>

            <input
                pInputText
                id="set-url-value"
                type="text"
                inputmode="url"
                autocomplete="url"
                placeholder="https://example.com"
                class="w-full"
                [formField]="urlForm.url"
            />

            @if (urlForm.url().touched() && urlForm.url().errors().length) {
                <small class="text-xs text-[color:var(--p-danger-color)]">
                    {{ urlForm.url().errors()[0].message }}
                </small>
            }
        </div>

        <div class="flex flex-col-reverse gap-2 pt-1 sm:flex-row sm:justify-end">
            <p-button
                type="button"
                label="Cancel"
                severity="secondary"
                [outlined]="true"
                [fluid]="true"
                [disabled]="isSaving()"
                styleClass="w-full sm:w-auto"
                (onClick)="close()"
            />

            <p-button
                type="submit"
                label="Save"
                icon="pi pi-check"
                [loading]="isSaving()"
                [fluid]="true"
                styleClass="w-full sm:w-auto"
            />
        </div>
    </form>
        </div>
    </div>
</div>
