name: Quick Tools

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']


env:
    PROJECT_DIR: quick-tools
    VERSION: quick-tools_v1.0.0
    TAG_NAME: quick-tools_v1.0.0
    RELEASE_NAME: quick-tools_v1.0.0
    ANDROID_FILE_NAME: quick-tools_v1.0.0.apk
    LINUX_TARGET_DIR_TAR: 'linux_quick_tool_portable'
    WINDOWS_FILE_NAME: 'quick-tools_v1.0.0_portable'

jobs:
    build-linux:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Restore dependencies
              run: dotnet restore

            - name: Download prerequisites
              run: |
                  chmod +x ./download_prerequisites.sh
                  ./download_prerequisites.sh

            - name: Build
              run: |
                  chmod +x ./build.sh
                  ./build.sh

            - name: Create QuickTools.gz
              run: |
                  tar -czf ${{ env.LINUX_TARGET_DIR_TAR }}.tar.gz ${{ env.LINUX_TARGET_DIR_TAR }}


            - name: Create Tag
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git tag "${TAG_NAME}"
                  git push origin "${TAG_NAME}"

            - name: Remove old release if exists
              run: |
                  if gh release view "${RELEASE_NAME}" &>/dev/null; then
                    echo "Deleting old release..."
                    gh release delete "${RELEASE_NAME}" -y
                  else
                    echo "No old release found."
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish
              uses: softprops/action-gh-release@v1
              with:
                  draft: false
                  name: ${{ env.RELEASE_NAME }}
                  tag_name: ${{ env.TAG_NAME }}
                  generate_release_notes: true
                  files: |
                      ./${{ env.PROJECT_DIR }}/src-tauri/gen/android/app/build/outputs/apk/universal/release/${{ env.FILE_NAME }}

    build-windows:
        steps:
            - uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x
            - name: Restore dependencies
              run: dotnet restore
            - name: Build
              run: dotnet build --no-restore
            - name: Test
              run: dotnet test --no-build --verbosity normal
            - name: Publish Release - Self-contained
              if: success() # chỉ chạy khi các bước trước thành công
              run: dotnet publish ExcelVideoLabeler.API/ExcelVideoLabeler.API.csproj -c Release -r win-x64 -p:SelfContained=true  -o ./publish

            # Dùng upload-artifact và download-artifact để chia sẻ thư mục publish giữa các jobs.
            - name: Upload published app
              uses: actions/upload-artifact@v4
              with:
                  name: published-app
                  path: ./publish
                  retention-days: 1 # Hoặc 1-90 ngày tùy ý

    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        needs: build

        steps:
            #  tải artifact xuống và đưa vào release
            - name: Download published app
              uses: actions/download-artifact@v4
              with:
                  name: published-app
                  path: ./publish

            # tao zip # Nén toàn bộ thư mục publish
            - name: Zip folder
              run: |
                  zip -r my_folder.zip ./publish

            # tao  tar # Nén toàn bộ thư mục publish
            - name: Tar folder
              run: |
                  tar -czvf my_folder.tar.gz ./publish

            # upload cac build len artifact
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: my-zipped-folder
                  path: my_folder.zip my_folder.tar.gz

            # tao github release
            - name: Create GitHub Release
              id: create_release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token tự động có sẵn
              with:
                  # nếu sử dụng cách xác định tag name này thì cần chỉ định tag và push
                  # git tag v1.0.0
                  # git push origin v1.0.0
                  # tag_name: ${{ github.ref_name }}  # Lấy tên tag (ví dụ: v1.0.0)
                  # release_name: "Release ${{ github.ref_name }}"

                  # không cần chỉ định tag khi push
                  tag_name: 'v1.0.0' # ✅ Đặt tên tag rõ ràng
                  release_name: 'Release v1.0.0'
                  draft: false
                  prerelease: false

            - name: Upload ZIP to Release
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.create_release.outputs.upload_url }} # URL từ bước tạo release
                  asset_path: ./my_folder.zip
                  asset_name: my_folder.zip
                  asset_content_type: application/zip

            - name: Upload TAR.GZ to Release
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.create_release.outputs.upload_url }}
                  asset_path: ./my_folder.tar.gz
                  asset_name: my_folder.tar.gz
                  asset_content_type: application/gzip
