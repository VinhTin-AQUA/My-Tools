name: Thanh Video Labeler

on:
    push:
        branches: [main]
        paths:
            - 'Thanh-Video-Labeler/**'
            - '.github/workflows/build-Thanh-Video-Labeler.yml'
env:
    PROJECT_DIR: Thanh-Video-Labeler
    TAG_NAME: Thanh-Video-Labeler_v1.0.0
    RELEASE_NAME: Thanh-Video-Labeler_v1.0.0

    WINDOWS_FILE_NAME: 'windows_Thanh-Video-Labeler_v1.0.0_portable'
    LINUX_FILE_NAME: 'linux_Thanh-Video-Labeler_v1.0.0_portable'

defaults:
    run:
        working-directory: Thanh-Video-Labeler # only apply for run command

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Build
              run: |
                  chmod +x ./build.sh
                  ./build.sh

            - name: Install 7zip
              run: |
                  sudo apt update
                  sudo apt install -y p7zip-full

            - name: Upload publish_linux to artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Thanh-Video-Labeler-Linux
                  path: ./Thanh-Video-Labeler_publish_linux
                  retention-days: 2

            - name: Upload publish_win to artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Thanh-Video-Labeler-Win
                  path: ./Thanh-Video-Labeler_publish_win
                  retention-days: 2

            - name: Create ZIP
              run: |
                  7z a -tzip ${{ env.LINUX_FILE_NAME }}.zip ./Thanh-Video-Labeler_publish_linux/
                  7z a -tzip ${{ env.WINDOWS_FILE_NAME }}.zip ./Thanh-Video-Labeler_publish_win/

            - name: Remove old tag if exists
              run: |
                  if git ls-remote --tags origin | grep -q "refs/tags/${{ env.TAG_NAME }}"; then
                    echo "Deleting old tag..."
                    git push origin :refs/tags/${{ env.TAG_NAME }}
                  else
                    echo "No old tag found."
                  fi

            - name: Delete existing release
              run: |
                  gh release delete ${{ env.TAG_NAME }} --yes || echo "No release to delete"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create Tag
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git tag ${{ env.TAG_NAME }}
                  git push origin ${{ env.TAG_NAME }}

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  draft: false
                  name: ${{ env.RELEASE_NAME }}
                  tag_name: ${{ env.TAG_NAME }}
                  generate_release_notes: true
                  files: |
                      ${{ env.WINDOWS_FILE_NAME }}.zip
                      ${{ env.LINUX_FILE_NAME }}.zip
