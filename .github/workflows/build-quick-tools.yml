# https://github.com/tauri-apps/tauri-action/issues/525

name: quick tools

on:
    push:
        branches: ['main']
        paths:
            - 'quick-tools/**'
            - '.github/workflows/build-quick-tools.yml'

    pull_request:
        branches: ['main']
        paths:
            - 'quick-tools/**'
            - '.github/workflows/build-quick-tools.yml'

defaults:
    run:
        working-directory: quick-tools # only apply for run command

env:
    PROJECT_DIR: quick-tools
    VERSION: 1.0.0                    # Chỉ dùng cho .NET
    TAG_NAME: quick-tools_v1.0.0      # Dùng cho Git tag
    RELEASE_NAME: quick-tools_v1.0.0  # Dùng cho release name

    LINUX_TARGET_DIR_TAR: 'linux_quick_tool_portable'
    WINDOWS_FILE_NAME: 'quick-tools_v1.0.0_portable'

jobs:
    publish-linux:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: setup node
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: Install Angular CLI globally
              run: npm install -g @angular/cli@21

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Download prerequisites
              run: |
                  chmod +x ./download_prerequisites.sh
                  ./download_prerequisites.sh

            - name: Build
              run: |
                  chmod +x ./build.sh
                  ./build.sh

            - name: Create tar.gz
              run: |
                  tar -czf ${{ env.LINUX_TARGET_DIR_TAR }}.tar.gz ${{ env.LINUX_TARGET_DIR_TAR }}

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux-build
                  path: ./${{ env.PROJECT_DIR }}/${{ env.LINUX_TARGET_DIR_TAR }}.tar.gz

    publish-windows:
        runs-on: windows-latest

        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: setup node
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: Install Angular CLI globally
              run: npm install -g @angular/cli@21

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Download prerequisites
              run: |
                  chmod +x ./download_prerequisites.bat
                  ./download_prerequisites.bat

            - name: Build
              run: |
                  chmod +x ./build.bat
                  ./build.bat

            - name: Create .zip
              shell: powershell
              run: |
                  Remove-Item -Recurse -Force $env:WINDOWS_FILE_NAME -ErrorAction Ignore
                  New-Item -ItemType Directory -Path $env:WINDOWS_FILE_NAME

                  Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/$env:WINDOWS_FILE_NAME.exe" -Destination $env:WINDOWS_FILE_NAME
                  Copy-Item "src-tauri/icons/Square150x150Logo.png" -Destination $env:WINDOWS_FILE_NAME

                  Compress-Archive -Path $env:WINDOWS_FILE_NAME -DestinationPath "$env:WINDOWS_FILE_NAME.zip" -Force

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows-build
                  path: ./${{ env.PROJECT_DIR }}/${{ env.WINDOWS_FILE_NAME }}.zip

    release:
        runs-on: ubuntu-latest
        needs: [publish-linux, publish-windows]
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Download all artifact
              uses: actions/download-artifact@v4
              with:
                  path: ${{ env.PROJECT_DIR }}/artifacts

            - name: List files
              run: ls -R artifacts

            - name: Remove old tag if exists
              run: |
                  if git ls-remote --tags origin | grep -q "refs/tags/${{ env.TAG_NAME }}"; then
                    echo "Deleting old tag..."
                    git push origin :refs/tags/${{ env.TAG_NAME }}
                  else
                    echo "No old tag found."
                  fi

            - name: Delete existing release
              run: |
                  gh release delete ${{ env.TAG_NAME }} --yes || echo "No release to delete"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create Tag
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git tag ${{ env.TAG_NAME }}
                  git push origin ${{ env.TAG_NAME }}

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  draft: false
                  name: ${{ env.RELEASE_NAME }}
                  tag_name: ${{ env.TAG_NAME }}
                  generate_release_notes: true
                  files: |
                      ${{ env.PROJECT_DIR }}/artifacts/linux-build/${{ env.LINUX_TARGET_DIR_TAR }}.tar.gz
                      # ${{ env.PROJECT_DIR }}/artifacts/android-build/${{ env.ANDROID_FILE_NAME }}
                      ${{ env.PROJECT_DIR }}/artifacts/windows-build/${{ env.WINDOWS_FILE_NAME }}.zip
